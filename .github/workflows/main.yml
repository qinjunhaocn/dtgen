name: Generate Device Tree from User-Provided IMG

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: '直接下载链接（IMG 镜像文件直链）'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y unzip file
          pip install twrpdtgen

      - name: Download IMG from user URL
        run: |
          URL="${{ github.event.inputs.image_url }}"
          echo "Downloading from $URL"
          # 下载并保存为 image.img
          curl -L -o image.img "$URL"
          # 验证文件类型（可选）
          file image.img
          echo "IMAGE_PATH=image.img" >> $GITHUB_ENV

      - name: Generate device tree
        run: |
          python3 -m twrpdtgen "${{ env.IMAGE_PATH }}"

      - name: Upload device tree artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-tree
          path: output/
